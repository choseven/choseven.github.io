<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voice Notes</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #080808;
    --surface: #111111;
    --border: #1e1e1e;
    --white: #ffffff;
    --dim: #555;
    --dimmer: #2a2a2a;
    --accent: #ffffff;
  }

  body {
    background: var(--bg);
    color: var(--white);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
  }

  /* ── CONTROL BAR ── */
  #controls {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 70px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    z-index: 100;
  }

  .ctrl-btn {
    background: none;
    border: 1.5px solid var(--white);
    color: var(--white);
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
    flex-shrink: 0;
  }
  .ctrl-btn:hover { background: rgba(255,255,255,0.08); transform: scale(1.07); }
  .ctrl-btn:active { transform: scale(0.95); }

  #playBtn { width: 52px; height: 52px; }
  #stopBtn {
    width: 42px; height: 42px;
    opacity: 0;
    transform: scale(0.6);
    pointer-events: none;
    transition: opacity 0.3s ease, transform 0.3s ease;
  }
  #stopBtn.visible { opacity: 1; transform: scale(1); pointer-events: auto; }
  .ctrl-btn svg { display: block; }

  /* ── CENTER STAGE ── */
  #stage {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    z-index: 50;
  }

  #centerBtn {
    width: 80px; height: 80px;
    background: none;
    border: 2px solid var(--white);
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--white);
    transition: all 0.3s ease;
  }
  #centerBtn:hover { background: rgba(255,255,255,0.07); transform: scale(1.05); }
  #centerBtn:active { transform: scale(0.95); }

  #centerLabel {
    font-family: 'Syne', sans-serif;
    font-size: 11px;
    letter-spacing: 0.2em;
    color: var(--dim);
    text-transform: uppercase;
  }

  body.recording #stage { top: -200px; opacity: 0; pointer-events: none; }

  /* ── VISUALIZER ── */
  #vizWrap {
    position: fixed;
    top: 90px; left: 50%;
    transform: translateX(-50%);
    width: min(700px, 90vw);
    opacity: 0;
    transition: opacity 0.5s ease 0.2s;
    pointer-events: none;
  }
  body.recording #vizWrap { opacity: 1; }

  #visualizer {
    width: 100%; height: 80px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 3px;
  }

  .bar {
    width: 4px;
    background: var(--white);
    border-radius: 2px 2px 0 0;
    height: 4px;
    transition: height 0.05s ease;
    opacity: 0.9;
  }

  /* ── MAIN CONTENT ── */
  #main {
    margin-top: 220px;
    width: min(720px, 92vw);
    padding-bottom: 60px;
    opacity: 0;
    transform: translateY(24px);
    transition: opacity 0.5s ease 0.3s, transform 0.5s ease 0.3s;
    pointer-events: none;
  }
  body.recording #main { opacity: 1; transform: translateY(0); pointer-events: auto; }

  /* ── TABS ── */
  #tabs { display: flex; border-bottom: 1px solid var(--border); }

  .tab {
    font-family: 'Syne', sans-serif;
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--dim);
    padding: 12px 24px;
    cursor: pointer;
    border: none;
    background: none;
    position: relative;
    transition: color 0.2s ease;
  }
  .tab::after {
    content: '';
    position: absolute;
    bottom: -1px; left: 0; right: 0;
    height: 1.5px;
    background: var(--white);
    transform: scaleX(0);
    transition: transform 0.25s ease;
  }
  .tab.active { color: var(--white); }
  .tab.active::after { transform: scaleX(1); }

  /* ── NOTE BOX ── */
  #noteBox {
    background: var(--surface);
    border: 1px solid var(--border);
    border-top: none;
    min-height: 340px;
    padding: 24px 28px;
    position: relative;
  }

  #notesPane { display: none; }
  #rawPane   { display: none; }
  #notesPane.pane-active { display: block; }
  #rawPane.pane-active   { display: block; }

  /* Note items */
  .note-item {
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid var(--dimmer);
    animation: fadeSlideIn 0.35s ease forwards;
  }
  .note-item:last-child { border-bottom: none; }

  @keyframes fadeSlideIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .note-bullet {
    width: 5px; height: 5px;
    background: var(--white);
    border-radius: 50%;
    flex-shrink: 0;
    margin-top: 7px;
  }

  .note-text {
    font-size: 14px;
    line-height: 1.6;
    color: #e8e8e8;
    letter-spacing: 0.01em;
  }

  /* Processing indicator */
  .note-thinking {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    animation: fadeSlideIn 0.3s ease forwards;
  }
  .thinking-dots {
    display: flex; gap: 4px;
  }
  .thinking-dots span {
    width: 4px; height: 4px;
    background: var(--dim);
    border-radius: 50%;
    animation: blink 1.2s ease infinite;
  }
  .thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
  .thinking-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink {
    0%, 100% { opacity: 0.2; }
    50% { opacity: 1; }
  }
  .thinking-label {
    font-size: 11px;
    color: var(--dim);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  /* Raw tab */
  #rawOutput {
    font-size: 13px;
    color: #888;
    line-height: 1.9;
    white-space: pre-wrap;
    word-break: break-word;
  }

  /* Placeholder */
  .placeholder {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    color: var(--dim);
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    pointer-events: none;
  }

  /* ── STATUS PILL ── */
  #statusPill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--dim);
    margin-bottom: 12px;
  }
  .rec-dot {
    width: 7px; height: 7px;
    background: #ff3b3b;
    border-radius: 50%;
    animation: pulse 1.2s ease infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  #idleHint {
    position: fixed;
    bottom: 32px; left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    letter-spacing: 0.16em;
    color: #333;
    text-transform: uppercase;
    transition: opacity 0.4s ease;
  }
  body.recording #idleHint { opacity: 0; }

  #noMicMsg {
    display: none;
    color: #ff6b6b;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-align: center;
    margin-top: 8px;
  }
</style>
</head>
<body>

<div id="controls">
  <button class="ctrl-btn" id="playBtn" title="Pause / Resume" style="display:none;">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="white"><rect x="5" y="3" width="4" height="18" rx="1"/><rect x="15" y="3" width="4" height="18" rx="1"/></svg>
  </button>
  <button class="ctrl-btn" id="stopBtn" title="Stop">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="white"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
  </button>
</div>

<div id="stage">
  <button id="centerBtn">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="white"><polygon points="5,3 19,12 5,21"/></svg>
  </button>
  <span id="centerLabel">Tap to record</span>
</div>

<div id="vizWrap">
  <div id="visualizer"></div>
</div>

<div id="main">
  <div id="statusPill">
    <span class="rec-dot"></span>
    <span id="statusText">Recording</span>
  </div>

  <div id="tabs">
    <button class="tab active" data-pane="notesPane">Smart Notes</button>
    <button class="tab" data-pane="rawPane">Raw Input</button>
  </div>

  <div id="noteBox">
    <div id="notesPane" class="pane-active">
      <div class="placeholder" id="notesPlaceholder">Notes will appear here…</div>
    </div>
    <div id="rawPane">
      <div class="placeholder" id="rawPlaceholder">Transcript will appear here…</div>
      <div id="rawOutput"></div>
    </div>
  </div>
</div>

<div id="idleHint">voice note recorder</div>
<div id="noMicMsg">Microphone access denied. Please allow microphone access and refresh.</div>

<script>
(() => {
  /* ── State ── */
  let mediaStream   = null;
  let audioCtx      = null;
  let analyser      = null;
  let recognition   = null;
  let isRecording   = false;
  let isPaused      = false;
  let vizRaf        = null;

  // Transcript state — track what we've already finalized to avoid duplication
  let finalizedTranscript = ''; // everything confirmed final, displayed in raw
  let pendingBuffer = '';       // finalized text not yet sent to Claude
  let processingQueue = [];     // chunks waiting to be sent
  let isCallingClaude = false;
  let thinkingEl = null;        // the "thinking…" indicator element

  /* ── Build visualizer bars ── */
  const vizEl = document.getElementById('visualizer');
  const BAR_COUNT = 60;
  const bars = [];
  for (let i = 0; i < BAR_COUNT; i++) {
    const b = document.createElement('div');
    b.className = 'bar';
    vizEl.appendChild(b);
    bars.push(b);
  }

  /* ── Elements ── */
  const centerBtn        = document.getElementById('centerBtn');
  const playBtn          = document.getElementById('playBtn');
  const stopBtn          = document.getElementById('stopBtn');
  const notesPane        = document.getElementById('notesPane');
  const rawPane          = document.getElementById('rawPane');
  const rawOutput        = document.getElementById('rawOutput');
  const notesPlaceholder = document.getElementById('notesPlaceholder');
  const rawPlaceholder   = document.getElementById('rawPlaceholder');
  const noMicMsg         = document.getElementById('noMicMsg');
  const statusText       = document.getElementById('statusText');

  /* ── Tabs ── */
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      notesPane.classList.remove('pane-active');
      rawPane.classList.remove('pane-active');
      document.getElementById(tab.dataset.pane).classList.add('pane-active');
    });
  });

  /* ── Buttons ── */
  centerBtn.addEventListener('click', startRecording);
  playBtn.addEventListener('click', togglePause);
  stopBtn.addEventListener('click', stopRecording);

  /* ────────────────────────────────────────────
     START
  ──────────────────────────────────────────── */
  async function startRecording() {
    try {
      mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch(e) {
      noMicMsg.style.display = 'block';
      return;
    }

    // Visualizer
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const src = audioCtx.createMediaStreamSource(mediaStream);
    analyser  = audioCtx.createAnalyser();
    analyser.fftSize = 128;
    src.connect(analyser);
    startViz();

    // Speech Recognition
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { alert('Speech Recognition not supported. Use Chrome or Edge.'); return; }

    recognition = new SR();
    recognition.continuous     = true;
    recognition.interimResults = false; // final only — avoids duplication
    recognition.lang           = 'en-US';
    recognition.onresult       = handleResult;
    recognition.onerror        = e => console.warn('SR error:', e.error);
    recognition.onend          = () => { if (isRecording && !isPaused) recognition.start(); };
    recognition.start();

    isRecording = true;
    isPaused    = false;
    document.body.classList.add('recording');
    playBtn.style.display = 'flex';
    stopBtn.classList.add('visible');
    setPauseIcon(false);
  }

  /* ────────────────────────────────────────────
     SPEECH RESULT — only fires on final results
  ──────────────────────────────────────────── */
  function handleResult(e) {
    let newText = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      // With interimResults=false every result here is final
      if (e.results[i].isFinal) {
        newText += e.results[i][0].transcript;
      }
    }
    if (!newText.trim()) return;

    // ── Raw tab: just append the spoken words ──
    rawPlaceholder.style.display = 'none';
    const span = document.createElement('span');
    span.textContent = newText + ' ';
    rawOutput.appendChild(span);
    finalizedTranscript += newText + ' ';

    // ── Accumulate for smart notes ──
    pendingBuffer += newText + ' ';

    // Trigger Claude when we have ≥20 words OR a sentence-ending punctuation
    const wordCount = pendingBuffer.trim().split(/\s+/).length;
    const hasPause  = /[.!?,;]/.test(pendingBuffer);
    if (wordCount >= 20 || (wordCount >= 8 && hasPause)) {
      enqueueForClaude(pendingBuffer.trim());
      pendingBuffer = '';
    }
  }

  /* ────────────────────────────────────────────
     CLAUDE SMART NOTES QUEUE
  ──────────────────────────────────────────── */
  function enqueueForClaude(text) {
    if (!text) return;
    processingQueue.push(text);
    drainQueue();
  }

  async function drainQueue() {
    if (isCallingClaude || processingQueue.length === 0) return;
    isCallingClaude = true;

    const chunk = processingQueue.shift();
    showThinking();

    try {
      const response = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'claude-sonnet-4-20250514',
          max_tokens: 1000,
          system: `You are a smart note-taking assistant. The user is speaking and you receive chunks of their speech transcript.
Your job: convert each chunk into 1–3 concise, clean bullet points capturing the KEY information.
Rules:
- Remove all filler words (um, uh, like, you know, basically, etc.)
- Fix grammar and sentence structure
- Be concise — each bullet should be a crisp, standalone insight or fact
- Do NOT add commentary, preamble, or explanations
- Return ONLY the bullet points, one per line, each starting with "- "
- If the chunk has no meaningful content (pure fillers, silence artifacts), return exactly: SKIP`,
          messages: [{ role: 'user', content: chunk }]
        })
      });

      const data = await response.json();
      hideThinking();

      if (!data.content || !data.content[0]) throw new Error('Empty response');

      const raw = data.content[0].text.trim();
      if (raw === 'SKIP' || !raw) {
        // nothing meaningful
      } else {
        raw.split('\n').forEach(line => {
          const text = line.replace(/^[-•*]\s*/, '').trim();
          if (text) addNote(text);
        });
      }
    } catch(err) {
      hideThinking();
      console.error('Claude API error:', err);
      // Fallback: show cleaned raw text as note
      const cleaned = chunk.replace(/\b(um+|uh+|er+|ah+|like|you know|i mean|basically|literally|actually|so well|okay|right|hmm+)\b/gi, '').replace(/\s{2,}/g, ' ').trim();
      if (cleaned.split(/\s+/).length >= 4) addNote(cleaned);
    } finally {
      isCallingClaude = false;
      // Process next in queue
      if (processingQueue.length > 0) drainQueue();
    }
  }

  /* ── Thinking indicator ── */
  function showThinking() {
    if (thinkingEl) return;
    notesPlaceholder.style.display = 'none';
    thinkingEl = document.createElement('div');
    thinkingEl.className = 'note-thinking';
    thinkingEl.innerHTML = `
      <div class="thinking-dots">
        <span></span><span></span><span></span>
      </div>
      <span class="thinking-label">Processing…</span>`;
    notesPane.appendChild(thinkingEl);
  }

  function hideThinking() {
    if (thinkingEl) { thinkingEl.remove(); thinkingEl = null; }
  }

  function addNote(text) {
    notesPlaceholder.style.display = 'none';
    const item = document.createElement('div');
    item.className = 'note-item';
    item.innerHTML = `<span class="note-bullet"></span><span class="note-text">${text}</span>`;
    notesPane.appendChild(item);
    item.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  /* ────────────────────────────────────────────
     PAUSE / RESUME
  ──────────────────────────────────────────── */
  function togglePause() {
    if (!isRecording) return;
    isPaused = !isPaused;
    if (isPaused) {
      recognition && recognition.stop();
      mediaStream && mediaStream.getAudioTracks().forEach(t => t.enabled = false);
      statusText.textContent = 'Paused';
      setPauseIcon(true);
    } else {
      mediaStream && mediaStream.getAudioTracks().forEach(t => t.enabled = true);
      recognition && recognition.start();
      statusText.textContent = 'Recording';
      setPauseIcon(false);
    }
  }

  function setPauseIcon(paused) {
    playBtn.innerHTML = paused
      ? `<svg width="20" height="20" viewBox="0 0 24 24" fill="white"><polygon points="5,3 19,12 5,21"/></svg>`
      : `<svg width="20" height="20" viewBox="0 0 24 24" fill="white"><rect x="5" y="3" width="4" height="18" rx="1"/><rect x="15" y="3" width="4" height="18" rx="1"/></svg>`;
  }

  /* ────────────────────────────────────────────
     STOP
  ──────────────────────────────────────────── */
  function stopRecording() {
    isRecording = false;
    isPaused    = false;
    recognition && recognition.abort();
    recognition = null;
    mediaStream && mediaStream.getTracks().forEach(t => t.stop());
    mediaStream = null;
    audioCtx && audioCtx.close();
    audioCtx = null;
    cancelAnimationFrame(vizRaf);
    bars.forEach(b => b.style.height = '4px');

    document.body.classList.remove('recording');
    playBtn.style.display = 'none';
    stopBtn.classList.remove('visible');

    // Flush any remaining buffer
    if (pendingBuffer.trim()) {
      enqueueForClaude(pendingBuffer.trim());
      pendingBuffer = '';
    }
  }

  /* ────────────────────────────────────────────
     VISUALIZER
  ──────────────────────────────────────────── */
  function startViz() {
    const data = new Uint8Array(analyser.frequencyBinCount);
    function draw() {
      vizRaf = requestAnimationFrame(draw);
      analyser.getByteFrequencyData(data);
      const step = Math.floor(data.length / BAR_COUNT);
      for (let i = 0; i < BAR_COUNT; i++) {
        const val = data[i * step] / 255;
        const pos = i < BAR_COUNT / 2 ? i : BAR_COUNT - 1 - i;
        const envelope = Math.sin((pos / (BAR_COUNT / 2)) * Math.PI * 0.5);
        const h = Math.max(4, val * 70 * (0.5 + envelope * 0.5));
        bars[i].style.height = h + 'px';
      }
    }
    draw();
  }
})();
</script>
</body>
</html>
