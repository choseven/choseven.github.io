<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voice Notes</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">

<!-- NLP engine — must load before the page script -->
<script src="nlp.js"></script>

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #080808;
    --surface: #111111;
    --border: #1e1e1e;
    --white: #ffffff;
    --dim: #555;
    --dimmer: #2a2a2a;
    --accent: #ffffff;

    /* Badge colours */
    --badge-action-bg:   #1a1000;
    --badge-action-fg:   #f5a623;
    --badge-action-bdr:  #3a2800;

    --badge-question-bg: #0a0a1a;
    --badge-question-fg: #7b9fff;
    --badge-question-bdr:#1a1a3a;

    --badge-idea-bg:     #0d1a0d;
    --badge-idea-fg:     #4dbb6e;
    --badge-idea-bdr:    #1a3a1a;

    --badge-date-bg:     #120a1a;
    --badge-date-fg:     #c47bff;
    --badge-date-bdr:    #2a1a3a;

    --badge-number-bg:   #0a1515;
    --badge-number-fg:   #4ecdc4;
    --badge-number-bdr:  #1a2f2f;

    --badge-fact-bg:     #111;
    --badge-fact-fg:     #999;
    --badge-fact-bdr:    #1e1e1e;
  }

  body {
    background: var(--bg);
    color: var(--white);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
  }

  /* ── CONTROL BAR ── */
  #controls {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 70px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    z-index: 100;
    transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .ctrl-btn {
    background: none;
    border: 1.5px solid var(--white);
    color: var(--white);
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
    flex-shrink: 0;
  }
  .ctrl-btn:hover { background: rgba(255,255,255,0.08); transform: scale(1.07); }
  .ctrl-btn:active { transform: scale(0.95); }

  #playBtn { width: 52px; height: 52px; }
  #stopBtn {
    width: 42px; height: 42px;
    opacity: 0;
    transform: scale(0.6);
    pointer-events: none;
    transition: opacity 0.3s ease, transform 0.3s ease;
  }
  #stopBtn.visible {
    opacity: 1;
    transform: scale(1);
    pointer-events: auto;
  }
  .ctrl-btn svg { display: block; }

  /* ── CENTER STAGE ── */
  #stage {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    z-index: 50;
  }

  #centerBtn {
    width: 80px; height: 80px;
    background: none;
    border: 2px solid var(--white);
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--white);
    transition: all 0.3s ease;
    flex-shrink: 0;
  }
  #centerBtn:hover { background: rgba(255,255,255,0.07); transform: scale(1.05); }
  #centerBtn:active { transform: scale(0.95); }

  #centerLabel {
    font-family: 'Syne', sans-serif;
    font-size: 11px;
    letter-spacing: 0.2em;
    color: var(--dim);
    text-transform: uppercase;
  }

  body.recording #stage {
    top: -200px;
    opacity: 0;
    pointer-events: none;
  }

  /* ── VISUALIZER ── */
  #vizWrap {
    position: fixed;
    top: 90px;
    left: 50%;
    transform: translateX(-50%);
    width: min(700px, 90vw);
    opacity: 0;
    transition: opacity 0.5s ease 0.2s;
    pointer-events: none;
  }
  body.recording #vizWrap { opacity: 1; }

  #visualizer {
    width: 100%;
    height: 80px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 3px;
  }

  .bar {
    width: 4px;
    background: var(--white);
    border-radius: 2px 2px 0 0;
    height: 4px;
    transition: height 0.05s ease;
    opacity: 0.9;
  }

  /* ── MAIN CONTENT ── */
  #main {
    margin-top: 220px;
    width: min(720px, 92vw);
    padding-bottom: 60px;
    opacity: 0;
    transform: translateY(24px);
    transition: opacity 0.5s ease 0.3s, transform 0.5s ease 0.3s;
    pointer-events: none;
  }
  body.recording #main {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }

  /* ── TABS ── */
  #tabs {
    display: flex;
    gap: 0;
    border-bottom: 1px solid var(--border);
    margin-bottom: 0;
  }

  .tab {
    font-family: 'Syne', sans-serif;
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--dim);
    padding: 12px 24px;
    cursor: pointer;
    border: none;
    background: none;
    position: relative;
    transition: color 0.2s ease;
  }
  .tab::after {
    content: '';
    position: absolute;
    bottom: -1px; left: 0; right: 0;
    height: 1.5px;
    background: var(--white);
    transform: scaleX(0);
    transition: transform 0.25s ease;
  }
  .tab.active { color: var(--white); }
  .tab.active::after { transform: scaleX(1); }

  /* ── NOTE BOX ── */
  #noteBox {
    background: var(--surface);
    border: 1px solid var(--border);
    border-top: none;
    min-height: 340px;
    padding: 24px 28px;
    position: relative;
  }

  #notesPane { display: block; }
  #rawPane   { display: none; }
  .pane-active#notesPane { display: block; }
  .pane-active#rawPane   { display: block; }

  /* ── NOTE ITEMS ── */
  .note-item {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 12px 0;
    border-bottom: 1px solid var(--dimmer);
    animation: fadeSlideIn 0.35s ease forwards;
  }
  .note-item:last-child { border-bottom: none; }

  @keyframes fadeSlideIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Badge (intent type label) */
  .note-badge {
    font-family: 'Syne', sans-serif;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    padding: 3px 7px;
    border-radius: 3px;
    flex-shrink: 0;
    margin-top: 3px;
    white-space: nowrap;
  }

  .badge-action   { background: var(--badge-action-bg);   color: var(--badge-action-fg);   border: 1px solid var(--badge-action-bdr);   }
  .badge-question { background: var(--badge-question-bg); color: var(--badge-question-fg); border: 1px solid var(--badge-question-bdr); }
  .badge-idea     { background: var(--badge-idea-bg);     color: var(--badge-idea-fg);     border: 1px solid var(--badge-idea-bdr);     }
  .badge-date     { background: var(--badge-date-bg);     color: var(--badge-date-fg);     border: 1px solid var(--badge-date-bdr);     }
  .badge-number   { background: var(--badge-number-bg);   color: var(--badge-number-fg);   border: 1px solid var(--badge-number-bdr);   }
  .badge-fact     { background: var(--badge-fact-bg);     color: var(--badge-fact-fg);     border: 1px solid var(--badge-fact-bdr);     }

  .note-body {
    flex: 1;
    min-width: 0;
  }

  .note-text {
    font-size: 14px;
    line-height: 1.65;
    color: #e8e8e8;
    letter-spacing: 0.01em;
  }

  /* Keyword chips below the note */
  .note-keywords {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-top: 6px;
  }
  .keyword-chip {
    font-size: 10px;
    letter-spacing: 0.06em;
    color: #444;
    background: #161616;
    border: 1px solid #222;
    border-radius: 2px;
    padding: 2px 6px;
  }

  /* Importance bar */
  .importance-bar-wrap {
    width: 4px;
    flex-shrink: 0;
    align-self: stretch;
    background: #1a1a1a;
    border-radius: 2px;
    overflow: hidden;
    margin-top: 3px;
  }
  .importance-bar-fill {
    width: 100%;
    border-radius: 2px;
    transition: height 0.4s ease;
  }

  /* Raw tab */
  #rawOutput {
    font-size: 13px;
    color: #888;
    line-height: 1.9;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .raw-chunk { animation: fadeSlideIn 0.3s ease forwards; }

  /* Placeholder */
  .placeholder {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: var(--dim);
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }

  /* ── STATUS PILL ── */
  #statusPill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--dim);
    margin-bottom: 12px;
  }
  .rec-dot {
    width: 7px; height: 7px;
    background: #ff3b3b;
    border-radius: 50%;
    animation: pulse 1.2s ease infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  /* NLP status indicator */
  #nlpStatus {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: #333;
    letter-spacing: 0.08em;
    margin-left: auto;
    padding-right: 2px;
  }

  /* ── IDLE HINT ── */
  #idleHint {
    position: fixed;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    letter-spacing: 0.16em;
    color: #333;
    text-transform: uppercase;
    transition: opacity 0.4s ease;
  }
  body.recording #idleHint { opacity: 0; }

  #noMicMsg {
    display: none;
    color: #ff6b6b;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-align: center;
    margin-top: 8px;
  }

  /* NLP engine banner */
  #nlpBanner {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 28px;
    display: none;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: #0c0c0c;
    border-top: 1px solid #1a1a1a;
    font-size: 10px;
    letter-spacing: 0.1em;
    color: #2a2a2a;
    z-index: 200;
  }
  body.recording #nlpBanner { display: flex; }
  .nlp-dot { width: 5px; height: 5px; background: #2a2a2a; border-radius: 50%; }
</style>
</head>
<body>

<!-- Fixed top control bar -->
<div id="controls">
  <button class="ctrl-btn" id="playBtn" title="Pause / Resume" style="display:none;">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="white"><rect x="5" y="3" width="4" height="18" rx="1"/><rect x="15" y="3" width="4" height="18" rx="1"/></svg>
  </button>
  <button class="ctrl-btn" id="stopBtn" title="Stop">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="white"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
  </button>
</div>

<!-- Center stage -->
<div id="stage">
  <button id="centerBtn">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="white"><polygon points="5,3 19,12 5,21"/></svg>
  </button>
  <span id="centerLabel">Tap to record</span>
</div>

<!-- Visualizer -->
<div id="vizWrap">
  <div id="visualizer"></div>
</div>

<!-- Main content panel -->
<div id="main">
  <div id="statusPill">
    <span class="rec-dot"></span>
    <span>Recording</span>
    <span id="nlpStatus">nlp ready</span>
  </div>

  <div id="tabs">
    <button class="tab active" data-pane="notesPane">Smart Notes</button>
    <button class="tab" data-pane="rawPane">Raw Input</button>
  </div>

  <div id="noteBox">
    <div id="notesPane" class="pane-active">
      <div class="placeholder" id="notesPlaceholder">Notes will appear here…</div>
    </div>
    <div id="rawPane">
      <div class="placeholder" id="rawPlaceholder">Transcript will appear here…</div>
      <div id="rawOutput"></div>
    </div>
  </div>
</div>

<div id="idleHint">voice note recorder</div>
<div id="noMicMsg">Microphone access denied. Please allow microphone access and refresh.</div>

<!-- NLP pipeline banner -->
<div id="nlpBanner">
  <span class="nlp-dot"></span>
  <span>VoiceNLP engine active — processing via nlp.js</span>
  <span class="nlp-dot"></span>
</div>

<script>
(() => {
  'use strict';

  /* ── Guard: ensure NLP engine loaded ── */
  if (!window.VoiceNLP) {
    console.error('[VoiceNotes] nlp.js failed to load. Smart Notes will be unavailable.');
  }
  const NLP = window.VoiceNLP || null;

  /* ── State ── */
  let mediaStream  = null;
  let audioCtx     = null;
  let analyser     = null;
  let recognition  = null;
  let isRecording  = false;
  let isPaused     = false;
  let vizRaf       = null;
  let noteCount    = 0;

  /* ── Importance bar colour helper ── */
  function importanceColor(score) {
    if (score >= 80) return '#ffffff';
    if (score >= 65) return '#aaaaaa';
    if (score >= 50) return '#666666';
    return '#333333';
  }

  /* ── Build visualizer bars ── */
  const vizEl = document.getElementById('visualizer');
  const BAR_COUNT = 60;
  const bars = [];
  for (let i = 0; i < BAR_COUNT; i++) {
    const b = document.createElement('div');
    b.className = 'bar';
    vizEl.appendChild(b);
    bars.push(b);
  }

  /* ── Elements ── */
  const centerBtn        = document.getElementById('centerBtn');
  const playBtn          = document.getElementById('playBtn');
  const stopBtn          = document.getElementById('stopBtn');
  const notesPane        = document.getElementById('notesPane');
  const rawOutput        = document.getElementById('rawOutput');
  const notesPlaceholder = document.getElementById('notesPlaceholder');
  const rawPlaceholder   = document.getElementById('rawPlaceholder');
  const noMicMsg         = document.getElementById('noMicMsg');
  const nlpStatus        = document.getElementById('nlpStatus');

  /* ── Tabs ── */
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      const target = tab.dataset.pane;
      document.getElementById('notesPane').classList.remove('pane-active');
      document.getElementById('rawPane').classList.remove('pane-active');
      document.getElementById(target).classList.add('pane-active');
    });
  });

  /* ── Center button ── */
  centerBtn.addEventListener('click', startRecording);
  playBtn.addEventListener('click', togglePause);
  stopBtn.addEventListener('click', stopRecording);

  /* ═══════════════════════════════════════
   *  START RECORDING
   * ═══════════════════════════════════════ */
  async function startRecording() {
    try {
      mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (e) {
      noMicMsg.style.display = 'block';
      return;
    }

    // Reset NLP session
    if (NLP) {
      NLP.reset();
      updateNLPStatus('listening');
    }

    // Audio analyser for visualizer
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const src = audioCtx.createMediaStreamSource(mediaStream);
    analyser  = audioCtx.createAnalyser();
    analyser.fftSize = 128;
    src.connect(analyser);
    startViz();

    // Speech recognition
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
      alert('Speech Recognition not supported in this browser. Try Chrome or Edge.');
      return;
    }
    recognition = new SR();
    recognition.continuous     = true;
    recognition.interimResults = true;
    recognition.lang           = 'en-US';

    recognition.onresult = handleResult;
    recognition.onerror  = (e) => {
      console.warn('[SR] error:', e.error);
      updateNLPStatus('error');
    };
    recognition.onend = () => {
      if (isRecording && !isPaused) recognition.start();
    };
    recognition.start();

    isRecording = true;
    isPaused    = false;
    noteCount   = 0;

    document.body.classList.add('recording');
    playBtn.style.display = 'flex';
    stopBtn.classList.add('visible');
    setPauseIcon(false);
  }

  /* ═══════════════════════════════════════
   *  TOGGLE PAUSE
   * ═══════════════════════════════════════ */
  function togglePause() {
    if (!isRecording) return;
    isPaused = !isPaused;
    if (isPaused) {
      recognition && recognition.stop();
      mediaStream && mediaStream.getAudioTracks().forEach(t => t.enabled = false);
      setPauseIcon(true);
      updateNLPStatus('paused');
    } else {
      mediaStream && mediaStream.getAudioTracks().forEach(t => t.enabled = true);
      recognition && recognition.start();
      setPauseIcon(false);
      updateNLPStatus('listening');
    }
  }

  function setPauseIcon(paused) {
    playBtn.innerHTML = paused
      ? `<svg width="20" height="20" viewBox="0 0 24 24" fill="white"><polygon points="5,3 19,12 5,21"/></svg>`
      : `<svg width="20" height="20" viewBox="0 0 24 24" fill="white"><rect x="5" y="3" width="4" height="18" rx="1"/><rect x="15" y="3" width="4" height="18" rx="1"/></svg>`;
  }

  /* ═══════════════════════════════════════
   *  STOP RECORDING
   * ═══════════════════════════════════════ */
  function stopRecording() {
    isRecording = false;
    isPaused    = false;

    recognition && recognition.abort();
    recognition = null;
    mediaStream && mediaStream.getTracks().forEach(t => t.stop());
    mediaStream = null;
    audioCtx && audioCtx.close();
    audioCtx = null;
    cancelAnimationFrame(vizRaf);
    bars.forEach(b => b.style.height = '4px');

    document.body.classList.remove('recording');
    playBtn.style.display = 'none';
    stopBtn.classList.remove('visible');

    // Flush remaining NLP buffer
    if (NLP) {
      const flushResults = NLP.flush();
      flushResults.forEach(renderNote);
      const session = NLP.getSession();
      updateNLPStatus(`done · ${session.acceptedCount} notes`);
      console.log('[VoiceNLP] Session summary:', session);
    }
  }

  /* ═══════════════════════════════════════
   *  SPEECH RESULT HANDLER
   *  Receives final speech segments and routes
   *  them through the NLP engine.
   * ═══════════════════════════════════════ */
  function handleResult(e) {
    let finalText = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) {
        finalText += e.results[i][0].transcript + ' ';
      }
    }
    if (!finalText.trim()) return;

    // ── Raw tab: stream transcript directly ──
    rawPlaceholder.style.display = 'none';
    const chunk = document.createElement('span');
    chunk.className = 'raw-chunk';
    chunk.textContent = finalText;
    rawOutput.appendChild(chunk);

    // ── Smart Notes: route through NLP engine ──
    if (NLP) {
      updateNLPStatus('processing…');
      const notes = NLP.processChunk(finalText);
      notes.forEach(renderNote);

      // Restore status
      const count = NLP.getSession().acceptedCount;
      updateNLPStatus(count > 0 ? `${count} note${count !== 1 ? 's' : ''}` : 'listening');
    }
  }

  /* ═══════════════════════════════════════
   *  RENDER A NOTE RESULT
   *  Accepts a NoteResult object from NLP engine
   *  and creates the DOM element.
   * ═══════════════════════════════════════ */
  function renderNote(noteResult) {
    if (!noteResult || !noteResult.text) return;

    notesPlaceholder.style.display = 'none';
    noteCount++;

    const { text, type, importance, keywords, badge } = noteResult;

    const item = document.createElement('div');
    item.className = 'note-item';
    item.setAttribute('data-type', type);
    item.setAttribute('data-importance', importance);

    // Importance bar (left side)
    const barWrap = document.createElement('div');
    barWrap.className = 'importance-bar-wrap';
    const barFill = document.createElement('div');
    barFill.className = 'importance-bar-fill';
    barFill.style.height  = importance + '%';
    barFill.style.background = importanceColor(importance);
    barWrap.appendChild(barFill);

    // Badge
    const badgeEl = document.createElement('span');
    badgeEl.className = `note-badge ${badge.cls}`;
    badgeEl.textContent = badge.label;

    // Text body
    const body = document.createElement('div');
    body.className = 'note-body';

    const textEl = document.createElement('div');
    textEl.className = 'note-text';
    textEl.textContent = text;
    body.appendChild(textEl);

    // Keyword chips (if any)
    if (keywords && keywords.length > 0) {
      const kw = document.createElement('div');
      kw.className = 'note-keywords';
      keywords.slice(0, 4).forEach(k => {
        const chip = document.createElement('span');
        chip.className = 'keyword-chip';
        chip.textContent = k.toLowerCase();
        kw.appendChild(chip);
      });
      body.appendChild(kw);
    }

    item.appendChild(barWrap);
    item.appendChild(badgeEl);
    item.appendChild(body);

    notesPane.appendChild(item);
    item.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  /* ═══════════════════════════════════════
   *  NLP STATUS INDICATOR
   * ═══════════════════════════════════════ */
  function updateNLPStatus(msg) {
    if (nlpStatus) nlpStatus.textContent = msg;
  }

  /* ═══════════════════════════════════════
   *  VISUALIZER
   * ═══════════════════════════════════════ */
  function startViz() {
    const data = new Uint8Array(analyser.frequencyBinCount);
    function draw() {
      vizRaf = requestAnimationFrame(draw);
      analyser.getByteFrequencyData(data);
      const step = Math.floor(data.length / BAR_COUNT);
      for (let i = 0; i < BAR_COUNT; i++) {
        const val = data[i * step] / 255;
        const pos = i < BAR_COUNT / 2 ? i : BAR_COUNT - 1 - i;
        const envelope = Math.sin((pos / (BAR_COUNT / 2)) * Math.PI * 0.5);
        const h = Math.max(4, val * 70 * (0.5 + envelope * 0.5));
        bars[i].style.height = h + 'px';
      }
    }
    draw();
  }

})();
</script>
</body>
